{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <div>
      <p class="badge">Account</p>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to sync your cart, checkout faster, and view orders.</p>
    </div>
  </section>

  <div class="card" style="max-width: 520px;">
    <form class="stack" method="post">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required>
      </div>
      <button class="btn full" type="submit">Login</button>
    </form>
    <p class="muted" style="margin-top:0.75rem;">No account? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  </div>
{% endblock %}
