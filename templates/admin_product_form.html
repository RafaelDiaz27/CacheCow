{% extends "base.html" %}
{% block content %}
  <section class="hero">
    <div>
      <p class="badge">Admin</p>
      <h1>{{ 'Edit' if product else 'Add' }} product</h1>
    </div>
  </section>

  <div class="card" style="max-width: 700px;">
    <form class="stack" method="post">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" value="{{ product.name if product else '' }}" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3">{{ product.description if product else '' }}</textarea>
      </div>
      <div class="field">
        <label for="unit_price">Price</label>
        <input id="unit_price" name="unit_price" type="number" step="0.01" value="{{ product.unit_price if product else '' }}" required>
      </div>
      <div class="field">
        <label for="stock_qty">Stock quantity</label>
        <input id="stock_qty" name="stock_qty" type="number" value="{{ product.stock_qty if product else 0 }}" required>
      </div>
      <div class="field">
        <label for="category_id">Category</label>
        <select id="category_id" name="category_id">
          <option value="">-- None --</option>
          {% for cat in categories %}
            <option value="{{ cat.category_id }}" {% if product and product.category_id == cat.category_id %}selected{% endif %}>
              {{ cat.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label><input type="checkbox" name="is_active" value="1" {% if not product or product.is_active %}checked{% endif %}> Active</label>
      </div>
      <button class="btn full" type="submit">{{ 'Update' if product else 'Create' }}</button>
    </form>
  </div>
{% endblock %}
